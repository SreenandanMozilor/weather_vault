<!DOCTYPE html>
<html lang = "en" >

<head>
    <title>Weather App</title>
    <meta charset="UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="login-view" class="empty-state">
        <div class="glass-card" style="max-width: 400px; margin: auto; text-align: center;">
            <div class="logo" style="justify-content: center; margin-bottom: 1rem;">
                <h1>☁️ Weather Vault</h1>
            </div>

            <div id="login-container">
                <p>Please log in to access your dashboard.</p>
                <form id="login-form">
                    <input type="text" id="username" placeholder="Username" required style="width: 100%; padding: 10px; margin: 10px 0;">
                    <input type="password" id="password" placeholder="Password" required style="width: 100%; padding: 10px; margin: 10px 0;">
                    <button type="submit" class="add-first-city-btn" style="width: 100%;">Login</button>
                </form>
                <p id="login-error" style="color: #EF4444; margin-top: 10px;" class="hidden"></p>
                
                <p style="margin-top: 15px; font-size: 0.9rem; color: var(--text-secondary);">
                    New here? <a href="#" id="show-signup" style="color: var(--accent-primary); text-decoration: none; font-weight: bold;">Create an account</a>
                </p>
            </div>

            <div id="signup-container" class="hidden">
                <p>Create a new account.</p>
                <form id="signup-form">
                    <input type="text" id="signup-username" placeholder="Choose a Username" required style="width: 100%; padding: 10px; margin: 10px 0;">
                    <input type="password" id="signup-password" placeholder="Choose a Password" required style="width: 100%; padding: 10px; margin: 10px 0;">
                    <button type="submit" class="add-first-city-btn" style="width: 100%;">Sign Up</button>
                </form>
                <p id="signup-error" style="color: #EF4444; margin-top: 10px;" class="hidden"></p>
                
                <p style="margin-top: 15px; font-size: 0.9rem; color: var(--text-secondary);">
                    Already have an account? <a href="#" id="show-login" style="color: var(--accent-primary); text-decoration: none; font-weight: bold;">Log in here</a>
                </p>
            </div>

        </div>
    </div>

    <div id="dashboard-view" class="hidden">
        <header class="app-header">
            <div class="logo">
                <h1>Skywatcher</h1>
            </div>
            <div class="header-controls">
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="city-name" placeholder="Search City">
                    <button id="add-city-button">Add City</button>
                    <div id="search-history"></div>
                </div>
                
                <button id="current-location-btn" title="Current Location">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                </button>

                <div class="unit-toggle">
                    <div class="toggle-slider"></div>
                    <div class="toggle-label celsius active">°C</div>
                    <div class="toggle-label fahrenheit">°F</div>
                </div>

                <button class="theme-toggle" id="theme-toggle">🌙</button>
                <button id="logout-btn" class="retry-error-btn">Logout</button>
            </div>
        </header>

        <main id="weather-grid"></main>
    </div>

    <div id="toast-container"></div>

    <script type="module" src="./js/app.js"></script>
</body>
